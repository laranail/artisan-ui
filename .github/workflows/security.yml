name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The laranail siblings resolve through git rather than Packagist, so every job
# hits the GitHub API to enumerate their refs. The built-in token lifts the
# shared unauthenticated rate limit; there is no secret to configure.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  audit:
    name: Composer audit · dist integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          # laranail-dist-integrity archives HEAD with `git archive`.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none

      - name: Drop cached laranail archives
        # laranail/* resolve through a single MOVING v0.1.0 tag, so a cached dist
        # archive under that name can be silently stale.
        shell: bash
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Audit
        run: composer audit --no-interaction

      # The built browser bundle and the views must survive `git archive`, or a
      # Composer install ships a panel with no script and no styles.
      - name: Verify the dist archive keeps every shipped path
        run: vendor/bin/laranail-dist-integrity

  # The OSV scan and the secret scan this repository has never had. The local `audit` job above is
  # deliberately left alone: it caches composer and pins its own PHP, which the shared workflow does
  # not, and its `composer update` audit covers dev dependencies that the shared job's
  # `--locked --no-dev` skips. The two are not duplicates; neither is a superset of the other.
  shared:
    name: shared scans (OSV, secrets)
    uses: laranail/.github/.github/workflows/security.yml@main
    with:
      php-version: '8.5'
    # Carries OP_SERVICE_ACCOUNT_TOKEN through for the ggshield step. The shared workflow declares it
    # optional and skips with a warning when absent, so this is correct before the credential exists.
    secrets: inherit
