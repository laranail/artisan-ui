name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# The laranail siblings resolve through git rather than Packagist, so every job
# hits the GitHub API to enumerate their refs. Unauthenticated that shares one
# low rate limit across the whole matrix, and jobs start failing with 504s and
# auth errors that look like dependency problems. The token is the built-in
# one; no secret to configure.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Generate an SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: artisan-ui.cdx.json
          # Attached below alongside the notes, rather than uploaded separately.
          upload-release-assets: false
          upload-artifact: false

      # A release whose notes say "see the changelog" is a release nobody reads.
      # Lift the tagged version's section out and use it as the body.
      - name: Extract this version's changelog section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md)
          {
            echo "body<<__CHANGELOG_EOF__"
            if [ -n "$notes" ]; then
              printf '%s\n' "$notes"
            else
              echo "See [CHANGELOG.md](https://github.com/laranail/artisan-ui/blob/main/CHANGELOG.md)."
            fi
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/laranail/artisan-ui/blob/main/CHANGELOG.md)."
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
          files: artisan-ui.cdx.json
