version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(npm)'
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    # Five is the default, and five is exactly how many action PRs were open
    # the first time this ran, which crowded setup-php out for months.
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(actions)'
    groups:
      # codeql-action/init and /analyze MUST move together: CodeQL fails with
      # "Loaded a configuration file for version X, but running version Y" when
      # they differ, and dependabot proposes each subpath as its own pull
      # request -- so each one alone is red. Grouping keeps them in one commit.
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
