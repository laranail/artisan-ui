name: Bug report
description: Something does not behave the way the documentation says it should.
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Before opening an issue, run `php artisan laranail::artisan-ui.doctor`. It
        reports the setup that decides whether the panel is reachable and which
        commands it will run, and catches most of what gets reported here.

        **Security problems do not belong here.** Email security@simtabi.com instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The command you ran from the panel, its input, and the relevant configuration.
      render: php
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: The output of `php artisan laranail::artisan-ui.doctor`.
      render: shell

  - type: textarea
    id: policy
    attributes:
      label: Policy output for the command
      description: The row for your command from `php artisan laranail::artisan-ui.policy`.
      render: shell

  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true

  - type: input
    id: php
    attributes:
      label: PHP and Laravel versions
      placeholder: 'PHP 8.4.17, Laravel 13.2'
    validations:
      required: true
